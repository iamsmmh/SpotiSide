name: Auto Fix YAML Formatting

on:
  push:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_CUSTOM_PAT }} 

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Prettier Linting Utility
        run: npm install -g prettier

      - name: Auto-Format and Repair YAML Files
        run: |
          npx prettier --write .github/workflows/*.yml .github/workflows/*.yaml

      - name: Commit and Push Structural Changes
        env:
          PUSH_TOKEN: ${{ secrets.MY_CUSTOM_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml .github/workflows/*.yaml
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "style: auto-fix yaml configuration errors [skip ci]"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          else
            echo "No formatting changes detected. Skipping push."
          fi
